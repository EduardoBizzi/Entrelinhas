name: entrelinhas
description: Biblioteca pessoal e agenda de leitura com Flutter, Firebase e SQLite.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  sqflite: ^2.4.2
  sqflite_common: ^2.5.6
  path: ^1.9.1
  connectivity_plus: ^6.1.5
  geolocator: ^14.0.2
  table_calendar: ^3.2.0
  image_picker: ^1.2.0
  path_provider: ^2.1.5
  http: ^1.6.0
  intl: ^0.20.2
  uuid: ^4.5.1
  url_launcher: ^6.3.2
flutter:
  uses-material-design: true
  assets:
    - assets/brand/icon.png
