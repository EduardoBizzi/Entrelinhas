name: entrelinhas
description: Biblioteca pessoal e agenda de leitura com Flutter, Firebase e SQLite.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  sqflite: ^2.4.2
  sqflite_common: ^2.5.6
  path: ^1.9.1
  connectivity_plus: ^6.1.5
  geolocator: ^14.0.2
  table_calendar: ^3.2.0
  image_picker: ^1.2.0
  path_provider: ^2.1.5
  http: ^1.6.0
  intl: ^0.20.2
  uuid: ^4.5.1
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.7+1
  sqlite3: ^2.9.4
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
flutter:
  uses-material-design: true
  assets:
    - assets/brand/
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/brand/icon.png
  adaptive_icon_background: '#153E35'
  adaptive_icon_foreground: assets/brand/icon_foreground.png
flutter_native_splash:
  color: '#153E35'
  image: assets/brand/splash.png
  android: true
  ios: false
  web: false
  android_12:
    color: '#153E35'
    image: assets/brand/icon_foreground.png
    icon_background_color: '#153E35'
